<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Bus Form</title>

    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>

<body>

<div class="bg-mesh"></div>
<div class="bg-grid"></div>

<div class="container">

    <header id="main-header">

        <div class="logo-section">

            <div class="logo-icon-wrap">
                🚌
            </div>

            <div>
                <div class="logo-text">
                    Bus Ticket Booking
                </div>

                <div class="logo-sub">
                    BUS CRUD MANAGEMENT
                </div>
            </div>

        </div>

        <div class="header-right">

            <a class="back-btn"
               th:href="@{/ui/buses}">
                ← Back
            </a>

        </div>

    </header>

    <section class="detail-hero">

        <div class="detail-icon-box">
            🚌
        </div>

        <div class="detail-title-block">

            <div class="detail-eyebrow"
                 th:text="${isEdit} ? 'UPDATE BUS' : 'NEW BUS'">
            </div>

            <h1 class="detail-title"
                th:text="${isEdit} ? 'Edit Bus' : 'Create Bus'">
            </h1>

            <p class="detail-desc">
                Manage bus information here.
            </p>

        </div>

    </section>

    <section class="crud-panel">

        <form

                th:action="${isEdit} ?
                @{/ui/buses/{id}(id=${busId})} :
                @{/ui/buses}"

                th:object="${bus}"

                method="post"

                class="crud-form"
        >

            <div class="field-grid">

                <label>
                    Registration Number
                </label>

                <input
                        type="text"
                        th:field="*{registrationNumber}"
                        placeholder="Enter registration number"
                >

            </div>

            <div class="field-grid">

                <label>
                    Capacity
                </label>

                <input
                        type="number"
                        th:field="*{capacity}"
                        placeholder="Enter capacity"
                >

            </div>

            <div class="field-grid">

                <label>
                    Type
                </label>

                <input
                        type="text"
                        th:field="*{type}"
                        placeholder="Enter bus type"
                >

            </div>

            <div class="field-grid">

                <label>
                    Office ID
                </label>

                <input
                        type="number"
                        th:field="*{officeId}"
                        placeholder="Enter office id"
                >

            </div>

            <div class="form-actions">

                <button type="submit"
                        class="card-cta crud-submit">

                    <span th:text="${isEdit} ? 'Update Bus' : 'Create Bus'">
                    </span>

                    <span class="card-cta-arrow">
                        →
                    </span>

                </button>

                <a th:href="@{/ui/buses}"
                   class="secondary-button">

                    Cancel

                </a>

            </div>

        </form>

    </section>

</div>

</body>
</html>
