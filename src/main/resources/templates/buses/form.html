<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${isEdit ? 'Edit Bus' : 'Create Bus'}">
        Bus Form
    </title>

    <link rel="stylesheet"
          th:href="@{/css/index.css}">

</head>

<body>

<div class="bg-mesh"></div>
<div class="bg-grid"></div>

<div class="container">

    <!-- HEADER -->

    <header id="main-header">

        <div class="logo-section">

            <div class="logo-icon-wrap">🚌</div>

            <div>

                <div class="logo-text">
                    Bus Ticket Booking
                </div>

                <div class="logo-sub">
                    Bus CRUD
                </div>

            </div>

        </div>

        <div class="header-right">

            <a class="back-btn"
               th:href="@{/ui/buses}">

                ← Back to List

            </a>

        </div>

    </header>

    <!-- HERO -->

    <section class="detail-hero">

        <div class="detail-icon-box">
            🚌
        </div>

        <div class="detail-title-block">

            <div class="detail-eyebrow"
                 th:text="${isEdit ? 'Update Bus' : 'New Bus'}">

                New Bus

            </div>

            <h1 class="detail-title"
                th:text="${isEdit ? 'Edit Bus' : 'Create Bus'}">

                Bus Form

            </h1>

            <p class="detail-desc">

                Fill in bus details below.
                Validation messages will appear next to each field.

            </p>

        </div>

    </section>

    <!-- FORM PANEL -->

    <section class="crud-panel">

        <!-- ERROR MESSAGE -->

        <div th:if="${errorMessage}"
             class="alert error-alert">

            <span th:text="${errorMessage}">
            </span>

        </div>

        <!-- SUCCESS MESSAGE -->

        <div th:if="${successMessage}"
             class="alert success-alert">

            <span th:text="${successMessage}">
            </span>

        </div>

        <form th:action="${isEdit ? '/ui/buses/' + busId : '/ui/buses'}"
              th:object="${bus}"
              method="post"
              class="crud-form">

            <!-- PUT METHOD -->

            <input type="hidden"
                   th:if="${isEdit}"
                   name="_method"
                   value="PUT">

            <!-- REGISTRATION NUMBER -->

            <div class="field-grid">

                <label for="registrationNumber">
                    Registration Number
                </label>

                <input id="registrationNumber"
                       type="text"
                       th:field="*{registrationNumber}"
                       placeholder="Enter registration number">

                <p class="field-error"
                   th:if="${#fields.hasErrors('registrationNumber')}"
                   th:errors="*{registrationNumber}">
                </p>

            </div>

            <!-- CAPACITY -->

            <div class="field-grid">

                <label for="capacity">
                    Capacity
                </label>

                <input id="capacity"
                       type="number"
                       th:field="*{capacity}"
                       placeholder="Enter capacity">

                <p class="field-error"
                   th:if="${#fields.hasErrors('capacity')}"
                   th:errors="*{capacity}">
                </p>

            </div>

            <!-- TYPE -->

            <div class="field-grid">

                <label for="type">
                    Type
                </label>

                <input id="type"
                       type="text"
                       th:field="*{type}"
                       placeholder="Enter bus type">

                <p class="field-error"
                   th:if="${#fields.hasErrors('type')}"
                   th:errors="*{type}">
                </p>

            </div>

            <!-- OFFICE ID -->

            <div class="field-grid">

                <label for="officeId">
                    Office ID
                </label>

                <input id="officeId"
                       type="number"
                       th:field="*{officeId}"
                       placeholder="Enter office ID">

                <p class="field-error"
                   th:if="${#fields.hasErrors('officeId')}"
                   th:errors="*{officeId}">
                </p>

            </div>

            <!-- ACTION BUTTONS -->

            <div class="form-actions">

                <button type="submit"
                        class="card-cta crud-submit">

                    <span th:text="${isEdit ? 'Update Bus' : 'Create Bus'}">

                        Submit

                    </span>

                    <span class="card-cta-arrow">
                        →
                    </span>

                </button>

                <a th:href="@{/ui/buses}"
                   class="secondary-button">

                    Cancel

                </a>

            </div>

        </form>

    </section>

</div>

</body>

</html>
