<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Address' : 'Create Address'">Address Form</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>

<div class="bg-mesh"></div>
<div class="bg-grid"></div>

<div class="container">

    <header id="main-header">
        <div class="logo-section">
            <div class="logo-icon-wrap">📍</div>
            <div>
                <div class="logo-text">Bus Ticket Booking</div>
                <div class="logo-sub">Address CRUD</div>
            </div>
        </div>

        <div class="header-right">
            <a class="back-btn" th:href="@{/ui/addresses}">← Back to List</a>
        </div>
    </header>

    <section class="detail-hero">
        <div class="detail-icon-box">📍</div>

        <div class="detail-title-block">
            <div class="detail-eyebrow" th:text="${isEdit} ? 'Update Address' : 'New Address'">
                New Address
            </div>
            <h1 class="detail-title" th:text="${isEdit} ? 'Edit Address' : 'Create Address'">
                Address Form
            </h1>
            <p class="detail-desc">
                Fill in the address details below. Validation messages will appear next to each field.
            </p>
        </div>
    </section>

    <section class="crud-panel">
        <form th:action="${isEdit} ? @{/ui/addresses/{id}(id=${addressId})} : @{/ui/addresses}"
              th:object="${address}"
              method="post"
              class="crud-form">

            <input type="hidden" th:if="${isEdit}" name="_method" value="PUT">

            <div class="field-grid">
                <label for="address">Address</label>
                <input id="address"
                       type="text"
                       th:field="*{address}"
                       placeholder="Enter address">
                <p class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
            </div>

            <div class="field-grid">
                <label for="city">City</label>
                <input id="city"
                       type="text"
                       th:field="*{city}"
                       placeholder="Enter city">
                <p class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></p>
            </div>

            <div class="field-grid">
                <label for="state">State</label>
                <input id="state"
                       type="text"
                       th:field="*{state}"
                       placeholder="Enter state">
                <p class="field-error" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></p>
            </div>

            <div class="field-grid">
                <label for="zipCode">Zip Code</label>
                <input id="zipCode"
                       type="text"
                       th:field="*{zipCode}"
                       placeholder="Enter zip code">
                <p class="field-error" th:if="${#fields.hasErrors('zipCode')}" th:errors="*{zipCode}"></p>
            </div>

            <div class="form-actions">
                <button type="submit" class="card-cta crud-submit">
                    <span th:text="${isEdit} ? 'Update Address' : 'Create Address'">Submit</span>
                    <span class="card-cta-arrow">→</span>
                </button>

                <a th:href="@{/ui/addresses}" class="secondary-button">Cancel</a>
            </div>
        </form>
    </section>

</div>

</body>
</html>
