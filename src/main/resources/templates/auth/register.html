<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Bus Ticket Booking</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="bg-mesh"></div>
<div class="bg-grid"></div>

<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-logo">🚌</div>
            <div>
                <div class="auth-title">Bus Ticket Booking</div>
                <div class="auth-subtitle">Create your account</div>
            </div>
        </div>

        <h1 class="auth-heading">Sign up</h1>
        <p class="auth-text">Create a new account to access the protected pages.</p>

        <div class="auth-alert" th:if="${error}" th:text="${error}"></div>

        <form class="auth-form" th:action="@{/register}" method="post">
            <label class="auth-field">
                <span>Username</span>
                <input type="text" name="username" placeholder="Choose a username" required>
            </label>

            <label class="auth-field">
                <span>Password</span>
                <input type="password" name="password" placeholder="Create a password" required>
            </label>

            <button class="auth-button" type="submit">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a th:href="@{/login}">Sign in</a>
        </p>
    </div>
</div>

</body>
</html>
