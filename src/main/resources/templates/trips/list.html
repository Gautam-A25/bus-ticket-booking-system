<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Trip Management
    </title>

    <link rel="stylesheet"
          th:href="@{/css/index.css}">

</head>

<body>

<div class="bg-mesh"></div>

<div class="bg-grid"></div>

<div class="container">

    <!-- HEADER -->

    <header id="main-header">

        <div class="logo-section">

            <div class="logo-icon-wrap">
                🚌
            </div>

            <div>

                <div class="logo-text">
                    Bus Ticket Booking
                </div>

                <div class="logo-sub">
                    Trip CRUD
                </div>

            </div>

        </div>

        <div class="header-right">

            <a class="back-btn"
               th:href="@{/}">

                ← Dashboard

            </a>

        </div>

    </header>

    <!-- TOOLBAR -->
    <!-- SUCCESS MESSAGE -->

<div th:if="${successMessage}"
     class="success-message">

    <span th:text="${successMessage}"></span>

</div>

<!-- ERROR MESSAGE -->

<div th:if="${errorMessage}"
     class="error-message">

    <span th:text="${errorMessage}"></span>

</div>
    <section class="crud-toolbar">

        <div>

            <h2 class="section-title">
                Trip List
            </h2>

        </div>

        <div class="crud-toolbar-actions">

            <a class="card-cta"
               th:href="@{/ui/trips/new}">

                Create Trip

                <span class="card-cta-arrow">
                    →
                </span>

            </a>

        </div>

    </section>

    <!-- SEARCH FORM -->

    <section class="crud-panel">

        <form th:action="@{/ui/trips/search}"

              method="get"

              class="crud-form">

            <div class="field-grid">

                <label>
                    From City
                </label>

                <input type="text"

                       name="fromCity"

                       placeholder="Enter source city"

                       required>

            </div>

            <div class="field-grid">

                <label>
                    To City
                </label>

                <input type="text"

                       name="toCity"

                       placeholder="Enter destination city"

                       required>

            </div>

            <div class="field-grid">

                <label>
                    Date
                </label>

                <input type="date"

                       name="date">

            </div>

            <div class="form-actions">

                <button type="submit"
                        class="card-cta crud-submit">

                    Search Trips

                    <span class="card-cta-arrow">
                        →
                    </span>

                </button>

            </div>

        </form>

    </section>

    <!-- TABLE -->

    <section class="crud-panel">

        <div class="table-wrapper">

            <table class="crud-table">

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Route</th>

                    <th>Bus</th>

                    <th>Seats</th>

                    <th>Fare</th>

                    <th>Departure</th>

                    <th>Arrival</th>

                    <th>Actions</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="trip : ${tripPage.content}">

                    <td th:text="${trip.id}"></td>

                    <td>

                        <span th:text="${trip.route.fromCity}"></span>

                        →

                        <span th:text="${trip.route.toCity}"></span>

                    </td>

                    <td th:text="${trip.bus.id}"></td>

                    <td th:text="${trip.availableSeats}"></td>

                    <td th:text="${trip.fare}"></td>

                    <td th:text="${trip.departureTime}"></td>

                    <td th:text="${trip.arrivalTime}"></td>

                    <td>

                        <div class="row-actions">

                            <!-- EDIT -->

                            <a class="crud-action edit-action"

                               th:href="@{/ui/trips/{id}/edit(id=${trip.id})}">

                                Edit

                            </a>

                            <!-- DELETE -->

                            <form th:action="@{/ui/trips/{id}/delete(id=${trip.id})}"

                                  method="post"

                                  class="inline-form">

                                <button type="submit"

                                        class="crud-action delete-action"

                                        onclick="return confirm('Delete this trip?')">

                                    Delete

                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </section>

    <!-- PAGINATION -->

    <section class="pagination-wrap"
             th:if="${tripPage.totalPages > 1}">

        <!-- PREVIOUS -->

        <a class="page-link nav-link"

           th:href="@{/ui/trips(page=${currentPage - 1}, size=${pageSize})}"

           th:classappend="${tripPage.first} ? ' disabled' : ''">

            ‹ Previous

        </a>

        <!-- PAGE NUMBERS -->

        <div class="pagination-pages">

            <a class="page-link"

               th:each="pageNum : ${#numbers.sequence(1, tripPage.totalPages)}"

               th:href="@{/ui/trips(page=${pageNum}, size=${pageSize})}"

               th:text="${pageNum}"

               th:classappend="${pageNum == currentPage} ? ' active' : ''">

                1

            </a>

        </div>

        <!-- NEXT -->

        <a class="page-link nav-link"

           th:href="@{/ui/trips(page=${currentPage + 1}, size=${pageSize})}"

           th:classappend="${tripPage.last} ? ' disabled' : ''">

            Next ›

        </a>

    </section>

</div>

</body>

</html>
