<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Route Form
    </title>

    <link rel="stylesheet"
          th:href="@{/css/index.css}">

</head>

<body>

<div class="bg-mesh"></div>

<div class="bg-grid"></div>

<div class="container">

    <header id="main-header">

        <div class="logo-section">

            <div class="logo-icon-wrap">
                🛣️
            </div>

            <div>

                <div class="logo-text">
                    Bus Ticket Booking
                </div>

                <div class="logo-sub">
                    Route CRUD
                </div>

            </div>

        </div>

        <div class="header-right">

            <a class="back-btn"
               th:href="@{/ui/routes}">

                ← Back to List

            </a>

        </div>

    </header>

    <section class="detail-hero">

        <div class="detail-icon-box">
            🛣️
        </div>

        <div class="detail-title-block">

            <div class="detail-eyebrow">

                <span th:if="${isEdit}">
                    Update Route
                </span>

                <span th:unless="${isEdit}">
                    New Route
                </span>

            </div>

            <h1 class="detail-title">

                <span th:if="${isEdit}">
                    Edit Route
                </span>

                <span th:unless="${isEdit}">
                    Create Route
                </span>

            </h1>

            <p class="detail-desc">

                Fill in the route details below.
                Validation messages will appear
                next to each field.

            </p>

        </div>

    </section>

    <section class="crud-panel">

        <!-- CREATE FORM -->

        <form th:unless="${isEdit}"
              th:action="@{/ui/routes}"
              th:object="${route}"
              method="post"
              class="crud-form">

            <div class="field-grid">

                <label>
                    From City
                </label>

                <input type="text"
                       th:field="*{fromCity}"
                       placeholder="Enter source city">

                <p class="field-error"
                   th:errors="*{fromCity}">
                </p>

            </div>

            <div class="field-grid">

                <label>
                    To City
                </label>

                <input type="text"
                       th:field="*{toCity}"
                       placeholder="Enter destination city">

                <p class="field-error"
                   th:errors="*{toCity}">
                </p>

            </div>

            <div class="field-grid">

                <label>
                    Break Points
                </label>

                <input type="number"
                       th:field="*{breakPoints}"
                       placeholder="Enter break points">

                <p class="field-error"
                   th:errors="*{breakPoints}">
                </p>

            </div>

            <div class="field-grid">

                <label>
                    Duration
                </label>

                <input type="number"
                       th:field="*{duration}"
                       placeholder="Enter duration">

                <p class="field-error"
                   th:errors="*{duration}">
                </p>

            </div>

            <div class="form-actions">

                <button type="submit"
                        class="card-cta crud-submit">

                    <span>
                        Create Route
                    </span>

                    <span class="card-cta-arrow">
                        →
                    </span>

                </button>

                <a th:href="@{/ui/routes}"
                   class="secondary-button">

                    Cancel

                </a>

            </div>

        </form>

        <!-- EDIT FORM -->

        <form th:if="${isEdit}"
              th:action="@{/ui/routes/{id}(id=${routeId})}"
              th:object="${route}"
              method="post"
              class="crud-form">

            <div class="field-grid">

                <label>
                    From City
                </label>

                <input type="text"
                       th:field="*{fromCity}">

                <p class="field-error"
                   th:errors="*{fromCity}">
                </p>

            </div>

            <div class="field-grid">

                <label>
                    To City
                </label>

                <input type="text"
                       th:field="*{toCity}">

                <p class="field-error"
                   th:errors="*{toCity}">
                </p>

            </div>

            <div class="field-grid">

                <label>
                    Break Points
                </label>

                <input type="number"
                       th:field="*{breakPoints}">

                <p class="field-error"
                   th:errors="*{breakPoints}">
                </p>

            </div>

            <div class="field-grid">

                <label>
                    Duration
                </label>

                <input type="number"
                       th:field="*{duration}">

                <p class="field-error"
                   th:errors="*{duration}">
                </p>

            </div>

            <div class="form-actions">

                <button type="submit"
                        class="card-cta crud-submit">

                    <span>
                        Update Route
                    </span>

                    <span class="card-cta-arrow">
                        →
                    </span>

                </button>

                <a th:href="@{/ui/routes}"
                   class="secondary-button">

                    Cancel

                </a>

            </div>

        </form>

    </section>

</div>

</body>
</html>
