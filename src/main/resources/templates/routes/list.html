<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Route Management
    </title>

    <link rel="stylesheet"
          th:href="@{/css/index.css}">

</head>

<body>

<div class="bg-mesh"></div>

<div class="bg-grid"></div>

<div class="container">

    <header id="main-header">

        <div class="logo-section">

            <div class="logo-icon-wrap">
                🛣️
            </div>

            <div>

                <div class="logo-text">
                    Bus Ticket Booking
                </div>

                <div class="logo-sub">
                    Route CRUD
                </div>

            </div>

        </div>

        <div class="header-right">

            <a class="back-btn"
               th:href="@{/}">

                ← Dashboard

            </a>

        </div>

    </header>

    <div th:if="${successMessage}"
         class="alert success-alert"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="alert error-alert"
         th:text="${errorMessage}">
    </div>

    <section class="crud-toolbar">

        <div>

            <h2 class="section-title">
                Route List
            </h2>

        </div>

        <div class="crud-toolbar-actions">

            <form th:action="@{/ui/routes}" method="get"
                  style="display: inline-flex; align-items: center; gap: 0.5rem; margin-right: 0.5rem;">
                <input type="number" name="searchId" th:value="${searchId}" placeholder="ID..." required
                       style="width: 80px; padding: 0.45rem 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; font-size: 0.85rem; outline: none; transition: all 0.2s;"
                       onfocus="this.style.borderColor='rgba(255,255,255,0.3)'; this.style.background='rgba(255,255,255,0.08)'"
                       onblur="this.style.borderColor='rgba(255,255,255,0.15)'; this.style.background='rgba(255,255,255,0.05)'">
                <button type="submit" class="back-btn" style="padding: 0.45rem 0.9rem; font-size: 0.85rem; height: 34px; line-height: 1; border-radius: 8px; cursor: pointer;">Find</button>
                <a th:if="${searchId != null}" th:href="@{/ui/routes}" class="back-btn" style="padding: 0.45rem 0.9rem; font-size: 0.85rem; height: 34px; line-height: 1; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1);">Clear</a>
            </form>

            <a class="back-btn"
               th:href="@{/modules/route}">

                View Module Endpoints

            </a>

            <a class="card-cta"
               th:href="@{/ui/routes/new}">

                Create Route

                <span class="card-cta-arrow">
                    →
                </span>

            </a>

        </div>

    </section>

    <section class="crud-panel">

        <div class="table-wrapper">

            <table class="crud-table">

                <thead>

                <tr>

                    <th>ID</th>

                    <th>From City</th>

                    <th>To City</th>

                    <th>Break Points</th>

                    <th>Duration</th>

                    <th>Actions</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="route : ${routePage.content}">

                    <td th:text="${route.id}"></td>

                    <td th:text="${route.fromCity}"></td>

                    <td th:text="${route.toCity}"></td>

                    <td th:text="${route.breakPoints}"></td>

                    <td th:text="${route.duration}"></td>

                    <td>

                        <div class="row-actions">

                            <!-- Edit -->

                            <a class="crud-action edit-action"

                               th:href="@{/ui/routes/{id}/edit(id=${route.id})}">

                                Edit

                            </a>

                            <!-- Delete -->

                            <form th:action="@{/ui/routes/{id}/delete(id=${route.id})}"

                                  method="post"

                                  class="inline-form">

                                <button type="submit"

                                        class="crud-action delete-action"

                                        onclick="return confirm('Delete this route?')">

                                    Delete

                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </section>

    <!-- Pagination -->

   <!-- PAGINATION -->

<section class="pagination-wrap"
         th:if="${routePage.totalPages > 1}">

    <!-- PREVIOUS -->

    <a class="page-link nav-link"

       th:href="@{/ui/routes(page=${currentPage - 1}, size=${pageSize})}"

       th:classappend="${routePage.first} ? ' disabled' : ''">

        ‹ Previous

    </a>

    <!-- PAGE NUMBERS -->

    <div class="pagination-pages">

        <a class="page-link"

           th:each="pageNum : ${#numbers.sequence(1, routePage.totalPages)}"

           th:href="@{/ui/routes(page=${pageNum}, size=${pageSize})}"

           th:text="${pageNum}"

           th:classappend="${pageNum == currentPage} ? ' active' : ''">

            1

        </a>

    </div>

    <!-- NEXT -->

    <a class="page-link nav-link"

       th:href="@{/ui/routes(page=${currentPage + 1}, size=${pageSize})}"

       th:classappend="${routePage.last} ? ' disabled' : ''">

        Next ›

    </a>

</section>

</body>

</html>
