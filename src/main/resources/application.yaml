server:
  port: 8080

spring:
  application:
    name: BusTicketBooking

  datasource:
    url: jdbc:mysql://localhost:3307/busticketbooking
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  thymeleaf:
    cache: false