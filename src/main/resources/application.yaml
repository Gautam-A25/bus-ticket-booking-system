spring:
  application:
    name: BusTicketBooking

  datasource:
    url: jdbc:mysql://localhost:3306/busticketbooking
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: Ultra-Super-Duper-Mega-Secret-crazy-encrypted-password-do-not-mess-up
  expiration-ms: 86400000